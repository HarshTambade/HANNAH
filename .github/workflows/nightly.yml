name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly quality and red-team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: node scripts/scan-secrets.mjs
      - run: node scripts/check-native-permissions.mjs
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm ci --ignore-scripts
        working-directory: server
      # Fails on any high or critical advisory not recorded, with a reason and an expiry, in .audit-exceptions.json.
      - name: Dependency audit
        run: |
          node scripts/audit-gate.mjs .
          node scripts/audit-gate.mjs client
          node scripts/audit-gate.mjs server
          node scripts/audit-gate.mjs . --omit-dev --level moderate
          node scripts/audit-gate.mjs client --omit-dev --level moderate
          node scripts/audit-gate.mjs server --omit-dev --level moderate
      - run: npm test
        working-directory: client
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest -q backend/tests
      - name: Run red-team suite
        env:
          HANNAH_API_TOKEN: ${{ secrets.HANNAH_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$HANNAH_API_TOKEN" ] || [ -z "$GROQ_API_KEY" ]; then
            echo "Red-team secrets are not configured; skipping."
            exit 0
          fi
          npm ci --ignore-scripts --prefix server
          (cd server && NODE_ENV=production PORT=3001 HANNAH_API_TOKEN="$HANNAH_API_TOKEN" GROQ_API_KEY="$GROQ_API_KEY" npm start &)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          HANNAH_API_URL=http://127.0.0.1:3001 HANNAH_API_TOKEN="$HANNAH_API_TOKEN" python scripts/run_redteam.py
      - name: P0 debt regression check
        run: |
          set -euo pipefail
          # Fail if code adds a way around Guardian/HITL approval, such as a
          # skipConfirmation flag, a bypassApproval helper, or a *_BYPASS env switch.
          # Detection regexes and prompt text that merely mention "bypass" are fine.
          if grep -RniE --exclude-dir=node_modules 'hitl[_-]?bypass|bypass[_-]?(hitl|approval|confirm)|skip[_-]?(hitl|approval|confirm)|(approval|confirm(ation)?)[_-]?bypass' client/src server scripts backend \
            || grep -RnE --exclude-dir=node_modules '\b[A-Z][A-Z0-9_]*_BYPASS\b' client/src client/.env.example server scripts backend; then
            echo "P0 debt regression detected" >&2
            exit 1
          fi
          npm test --prefix client
          python3 -m pytest -q backend/tests

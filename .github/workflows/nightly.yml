name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly quality and red-team
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm audit --audit-level=high
        working-directory: client
      - run: npm audit --prefix server --audit-level=high
      - run: npm test
        working-directory: client
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest -q backend/tests
      - name: Run red-team suite
        env:
          SHANAYA_API_TOKEN: ${{ secrets.SHANAYA_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$SHANAYA_API_TOKEN" ] || [ -z "$GROQ_API_KEY" ]; then
            echo "Red-team secrets are not configured; skipping."
            exit 0
          fi
          npm ci --ignore-scripts --prefix server
          (cd server && NODE_ENV=production PORT=3001 SHANAYA_API_TOKEN="$SHANAYA_API_TOKEN" GROQ_API_KEY="$GROQ_API_KEY" npm start &)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          SHANAYA_API_URL=http://127.0.0.1:3001 SHANAYA_API_TOKEN="$SHANAYA_API_TOKEN" python scripts/run_redteam.py
      - name: P0 debt regression check
        run: |
          set -euo pipefail
          # Fail if any P0 debt regression is detected (for example a HITL bypass).
          if grep -Rni "HITL bypass\|bypass.*approval\|skip.*confirmation" client/src server scripts backend; then
            echo "P0 debt regression detected" >&2
            exit 1
          fi
          npm test --prefix client
          python3 -m pytest -q backend/tests

      - name: Run red-team suite
        env:
          SHANAYA_API_TOKEN: ${{ secrets.SHANAYA_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$SHANAYA_API_TOKEN" ] || [ -z "$GROQ_API_KEY" ]; then
            echo "Red-team secrets are not configured; skipping."
            exit 0
          fi
          npm ci --ignore-scripts --prefix server
          (cd server && NODE_ENV=production PORT=3001 SHANAYA_API_TOKEN="$SHANAYA_API_TOKEN" GROQ_API_KEY="$GROQ_API_KEY" npm start &)
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          SHANAYA_API_URL=http://127.0.0.1:3001 SHANAYA_API_TOKEN="$SHANAYA_API_TOKEN" python scripts/run_redteam.py

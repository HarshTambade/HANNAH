name: Build HANNAH

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the completed platform packages as a GitHub Release
        type: boolean
        required: true
        default: false
      release_tag:
        description: New version tag to create when publishing manually (for example v1.0.0)
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_OFFLINE_MODEL_URL: ${{ vars.VITE_OFFLINE_MODEL_URL }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
  ELECTRON_RELEASE_REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
  ELECTRON_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag) || '' }}

jobs:
  quality:
    name: Security and test gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Check that every version field matches (and the tag, on releases)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            node scripts/check-versions.mjs --tag "$GITHUB_REF_NAME"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            node scripts/check-versions.mjs --tag "${{ inputs.release_tag }}"
          else
            node scripts/check-versions.mjs
          fi
      - name: Secret scan (tracked files)
        run: node scripts/scan-secrets.mjs
      - name: Native permission audit (Android manifest, iOS Info.plist)
        run: node scripts/check-native-permissions.mjs
      - name: Brand check (HANNAH's icon on every platform, no framework defaults)
        run: node scripts/check-brand-assets.mjs
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm ci --ignore-scripts
        working-directory: server
      # Fails on any high or critical advisory not recorded, with a reason and an expiry, in .audit-exceptions.json.
      - name: Dependency audit (all dependencies, high and above)
        run: |
          node scripts/audit-gate.mjs .
          node scripts/audit-gate.mjs client
          node scripts/audit-gate.mjs server
      - name: Dependency audit (what ships, moderate and above, no exceptions)
        run: |
          node scripts/audit-gate.mjs . --omit-dev --level moderate
          node scripts/audit-gate.mjs client --omit-dev --level moderate
          node scripts/audit-gate.mjs server --omit-dev --level moderate
      - name: Licence check (production dependencies of root, client and server)
        run: node scripts/check-licenses.mjs
      - name: Software bill of materials (CycloneDX, production dependencies)
        run: |
          # The two units that ship: the web/app bundle and the API server. (The root package is a workspace wrapper.)
          mkdir -p sbom
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only --prefix client > sbom/hannah-client.cdx.json
          npm sbom --sbom-format cyclonedx --omit dev --package-lock-only --prefix server > sbom/hannah-server.cdx.json
          node -e 'for (const f of ["client","server"]) { const b = require(`./sbom/hannah-${f}.cdx.json`); console.log(`${f}: ${b.components.length} components`); }'
      - uses: actions/upload-artifact@v4
        with:
          name: hannah-sbom
          path: sbom
      - name: Lint (bug rules; errors fail the build)
        run: |
          npm run lint --prefix client
          npm run lint --prefix server
      - name: Typecheck the app
        run: npx tsc --noEmit -p .
        working-directory: client
      - run: npm test
        working-directory: client
      # The workforce live view tests drive a real headless Chromium.
      - name: Install Chromium for the server's browser tests
        run: npx playwright install --with-deps chromium
      - name: Server tests (API, accounts on SQLite and Postgres, routing)
        run: npm test
        working-directory: server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest -q backend/tests
      - name: Robot runtime tests (unit and built-in simulator; standard library only)
        run: python -m unittest discover -s tests -t .
        working-directory: robotics/runtime
      - name: Device hub tests (protocol stacks, simulated devices, image description; standard library only)
        run: |
          python -m unittest discover -s tests -t .
          python ../tools/build_catalog.py --check
          python ../tools/image_manifest.py --check
          python ../tools/progress.py --check
        working-directory: hannah-os/runtime

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: client
      # e2e/workflows.spec.ts starts a real HANNAH server (SQLite) to test the workflow engine end to end.
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: npm run build
        working-directory: client
      - run: npx playwright install --with-deps
      # The "Hey HANNAH" test builds the 41 MB speech model from its pinned archive; keep it between runs.
      - uses: actions/cache@v4
        with:
          path: client/.cache/wake-model
          key: wake-model-vosk-small-en-us-0.15-v1
      - run: npm run test:e2e --prefix client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
  web:
    name: Web and PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build:analyzer
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: CI='' npm run build
        working-directory: client
      - run: npm run bundle:size -- --strict
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: hannah-web-pwa
          path: |
            client/dist
            client/bundle-report.html

  electron:
    name: Electron (${{ matrix.os }})
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15, not macos-latest: on 2026-11-18 GitHub left macos-latest jobs unassigned ("not acquired by Runner", capacity) while macos-15 ran.
        os: [macos-15, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap add @capawesome/capacitor-electron
        working-directory: client
      - name: Verify generated Electron project
        shell: bash
        run: |
          if [ ! -f client/electron/package.json ]; then
            echo "Capacitor Electron did not create client/electron/package.json." >&2
            exit 1
          fi
      - name: Apply Electron release configuration
        working-directory: client/electron
        env:
          ELECTRON_RELEASE_REQUESTED: ${{ env.ELECTRON_RELEASE_REQUESTED }}
          ELECTRON_RELEASE_TAG: ${{ env.ELECTRON_RELEASE_TAG }}
        run: node ../scripts/prepare-electron-release.mjs
      # cap add generates client/electron without a lockfile, so npm ci cannot run here.
      # electron-builder downloads its own NSIS; no system install is needed.
      - run: npm install --no-audit --no-fund
        working-directory: client/electron
      # Fails on any high or critical advisory not recorded, with a reason and an expiry, in .audit-exceptions.json.
      - name: Dependency audit (Electron packaging tools)
        run: node scripts/audit-gate.mjs client/electron
      - run: npx cap sync @capawesome/capacitor-electron
        working-directory: client
      - name: Package Electron app
        working-directory: client/electron
        shell: bash
        env:
          ELECTRON_RELEASE_REQUESTED: ${{ env.ELECTRON_RELEASE_REQUESTED }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE || secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$ELECTRON_RELEASE_REQUESTED" = "true" ]; then
            if [ "$RUNNER_OS" = "Windows" ] && { [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ]; }; then
              echo "Windows signing secrets are not configured; building an unsigned Electron app." >&2
              ELECTRON_RELEASE_REQUESTED=false
            fi
            if [ "$RUNNER_OS" = "macOS" ] && { [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
              echo "macOS signing secrets are not configured; building an unsigned Electron app." >&2
              ELECTRON_RELEASE_REQUESTED=false
            fi
          fi
          if [ "$ELECTRON_RELEASE_REQUESTED" != "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # GitHub Releases are published by the dedicated release job below.
          # Do not let electron-builder attempt an automatic Snap Store upload;
          # snapcraft is not installed on the runner and Snap is not required
          # for the release assets staged by this workflow.
          # Windows ships the NSIS installer from electron-builder.yml: Start-menu entry,
          # uninstaller, and the only target electron-updater can update.
          pack_args=(--publish never)
          # Skip macOS code signing only for unsigned builds; signed releases keep their identity.
          if [ "$ELECTRON_RELEASE_REQUESTED" != "true" ]; then
            pack_args+=(--config.mac.identity=null)
          fi
          npm run pack -- "${pack_args[@]}"
      # Packaging alone doesn't prove the app starts: 1.3.0 shipped a main
      # process that crashed on launch. Start the packaged app, wait for its
      # page to load, and fail the build if it doesn't.
      - name: Launch the packaged app
        working-directory: client/electron/dist
        shell: bash
        timeout-minutes: 8
        env:
          HANNAH_SMOKE_TEST: "1"
          # macOS runners can take two minutes just to start an unsigned app.
          HANNAH_SMOKE_TIMEOUT_MS: "240000"
        run: |
          case "$RUNNER_OS" in
            macOS) app=$(find . -path "*/HANNAH.app/Contents/MacOS/HANNAH" -type f | head -n 1) ;;
            Windows) app=$(find . -path "*win-unpacked/HANNAH.exe" -type f | head -n 1) ;;
            Linux) app=$(find . -path "*linux-unpacked/*" -maxdepth 2 -type f -perm -u+x ! -name "*.so*" ! -name "chrome-sandbox" ! -name "chrome_crashpad_handler" | head -n 1) ;;
          esac
          if [ -z "$app" ]; then echo "::error::Couldn't find the packaged app."; find . -maxdepth 3 | head -n 40; exit 1; fi
          export HANNAH_SMOKE_FILE="$RUNNER_TEMP/hannah-smoke.txt"
          echo "Launching $app"
          set +e
          if [ "$RUNNER_OS" = "Linux" ]; then
            output=$(timeout 300 xvfb-run -a "$app" --no-sandbox 2>&1)
          elif [ "$RUNNER_OS" = "Windows" ]; then
            output=$(timeout 300 "$app" 2>&1)
          else
            output=$("$app" 2>&1)
          fi
          set -e
          echo "$output" | tail -n 30
          [ -f "$HANNAH_SMOKE_FILE" ] && cat "$HANNAH_SMOKE_FILE"
          smoke_log="$output"$'\n'"$(cat "$HANNAH_SMOKE_FILE" 2>/dev/null || true)"
          # A here-string, not a pipe: with pipefail, grep -q closing the pipe early fails the step.
          if ! grep -q "HANNAH_SMOKE_OK" <<< "$smoke_log"; then
            echo "::error::The packaged desktop app didn't start and load its page."
            exit 1
          fi
      # The source brand check can pass while packaging still ships Electron's icon
      # (v1.4.0's macOS app did). Look inside what was built. Windows embeds the icon in the .exe, which this doesn't parse.
      - name: Check the packaged app's icon
        if: runner.os != 'Windows'
        run: node scripts/check-packaged-icons.mjs client/electron/dist
      # Computer control on macOS needs the helper outside app.asar, for both architectures, and runnable.
      - name: Check the packaged macOS control helper
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r helper; do
            found=1
            echo "$helper: $(lipo -archs "$helper")"
            lipo -archs "$helper" | grep -q arm64
            lipo -archs "$helper" | grep -q x86_64
            # It answers (Accessibility is off on the runner, which it must report, not hide).
            echo '{}' | "$helper" status | tee /dev/stderr | grep -q '"ok":true'
          done < <(find client/electron/dist -path '*HANNAH.app/Contents/Resources/app.asar.unpacked/assets/hannah-control' -type f)
          if [ "$found" = 0 ]; then echo "::error::The packaged app has no control helper (app.asar.unpacked/assets/hannah-control)."; exit 1; fi
      - name: Enforce renderer and installer size targets
        working-directory: client/electron
        run: node ../scripts/check-bundle-size.mjs --strict --package-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: hannah-electron-${{ matrix.os }}
          path: client/electron/dist/**
          if-no-files-found: error

  redteam:
    name: Red-team suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run red-team suite
        env:
          HANNAH_API_TOKEN: ${{ secrets.HANNAH_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$HANNAH_API_TOKEN" ] || [ -z "$GROQ_API_KEY" ]; then
            echo "Red-team secrets are not configured; skipping."
            exit 0
          fi
          npm ci --ignore-scripts --prefix server
          (cd server && NODE_ENV=production PORT=3001 HANNAH_API_TOKEN="$HANNAH_API_TOKEN" GROQ_API_KEY="$GROQ_API_KEY" HANNAH_RATE_LIMIT_AGENT_MAX=1000 npm start &) 
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          HANNAH_API_URL=http://127.0.0.1:3001 HANNAH_API_TOKEN="$HANNAH_API_TOKEN" python scripts/run_redteam.py
          pkill -f "node.*index.js" || true

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.22.1"
      - name: Require Android release signing credentials
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are not configured; building an unsigned debug APK instead." >&2
          fi
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap sync android
        working-directory: client
      - run: npm run cap:patch:android
        working-directory: client
      - name: Build Android package
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            release_keystore="$RUNNER_TEMP/hannah-release.keystore"
            trap 'rm -f "$release_keystore"' EXIT
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$release_keystore"
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file="$release_keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hannah-android
          path: |
            client/android/app/build/outputs/apk/**/*.apk
            client/android/app/build/outputs/bundle/**/*.aab

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require iOS release signing credentials
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 || secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD || secrets.IOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ "$IOS_SIGNING_ENABLED" != "true" ] || [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPSTORE_ISSUER_ID" ] || [ -z "$APPSTORE_API_KEY_ID" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "iOS signing secrets are not configured; skipping signed iOS release artifacts." >&2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run cap:patch:ios
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap sync ios
        working-directory: client
      - name: Import Apple signing certificate
        if: vars.IOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 || secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD || secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/hannah-signing.p12"
          keychain_path="$RUNNER_TEMP/hannah-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          rm -f "$certificate_path"
      - name: Install provisioning profile
        if: vars.IOS_SIGNING_ENABLED == 'true'
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          profile-type: IOS_APP_STORE
          bundle-id: com.hannah.companion
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Archive iOS app
        env:
          IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$IOS_SIGNING_ENABLED" = "true" ]; then
            CODE_SIGNING_FLAG="CODE_SIGNING_ALLOWED=YES"
          else
            CODE_SIGNING_FLAG="CODE_SIGNING_ALLOWED=NO"
          fi
          if [ -d client/ios/App/App.xcworkspace ]; then
            XCODE_CONTAINER=(-workspace client/ios/App/App.xcworkspace)
          elif [ -d client/ios/App/App.xcodeproj ]; then
            XCODE_CONTAINER=(-project client/ios/App/App.xcodeproj)
          else
            echo "No generated iOS workspace or project found under client/ios/App" >&2
            find client/ios -maxdepth 3 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print >&2 || true
            exit 1
          fi
          xcodebuild \
            "${XCODE_CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HANNAH.xcarchive" \
            "$CODE_SIGNING_FLAG" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
      - name: Export signed iOS IPA
        if: vars.IOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/HANNAH.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Remove temporary signing keychain
        if: always() && vars.IOS_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/hannah-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/hannah-signing.p12"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: hannah-ios-archive
          path: |
            ${{ runner.temp }}/HANNAH.xcarchive
            ${{ runner.temp }}/ios-export/*.ipa

  release:
    name: Publish release installers
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    # Nothing is published unless the tests and every platform build passed.
    needs: [quality, e2e, electron, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations for every published package (verify with `gh attestation verify`).
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$RELEASE_TAG'; use vMAJOR.MINOR.PATCH (optionally with a prerelease suffix)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-versions.mjs --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          pattern: hannah-*
          path: release-input
          merge-multiple: false
      - name: Stage platform installers
        run: bash scripts/stage-release-assets.sh release-input release/assets
      - name: Add the software bill of materials to the release
        run: |
          cp release-input/hannah-sbom/*.cdx.json release/assets/
          (cd release/assets && sha256sum *.cdx.json >> SHA256SUMS)
      - name: Sign Linux packages with GPG (when a release key is configured)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "::notice::GPG_PRIVATE_KEY and GPG_PASSPHRASE are not set; Linux packages ship with SHA-256 checksums only."
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-key.asc"; pass="$RUNNER_TEMP/release-key.pass"
          trap 'rm -f "$key" "$pass"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" > "$key"; printf '%s' "$GPG_PASSPHRASE" > "$pass"
          gpg --batch --import "$key"
          for package in release/assets/HANNAH-Linux.AppImage release/assets/HANNAH-Linux.deb; do
            gpg --batch --yes --pinentry-mode loopback --passphrase-file "$pass" --armor --detach-sign --output "$package.asc" "$package"
          done
          (cd release/assets && sha256sum HANNAH-Linux.*.asc >> SHA256SUMS)
          echo "GPG_SIGNED=true" >> "$GITHUB_ENV"
      - name: Write release notes
        env:
          MAC_SIGNED: ${{ secrets.MACOS_CSC_LINK != '' && secrets.APPLE_ID != '' }}
          WIN_SIGNED: ${{ secrets.WINDOWS_CERTIFICATE != '' || secrets.WINDOWS_CSC_LINK != '' }}
        run: |
          node scripts/release-notes.mjs "$RELEASE_TAG" release/SIGNING_STATUS > release/notes.md
          cat release/notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect the packages before anything is published
        run: bash scripts/inspect-release-assets.sh release/assets release/notes.md
      - name: Attest build provenance for every package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/assets/*
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "HANNAH $RELEASE_TAG" --notes-file release/notes.md
            gh release upload "$RELEASE_TAG" release/assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release/assets/* \
              --target "$GITHUB_SHA" \
              --title "HANNAH $RELEASE_TAG" \
              --notes-file release/notes.md \
              --latest
          fi
      - name: Verify the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          published="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          expected="$(cd release/assets && ls -1 | sort)"
          if [ "$published" != "$expected" ]; then
            echo "Published assets differ from the staged ones:" >&2
            diff <(echo "$expected") <(echo "$published") >&2 || true
            exit 1
          fi
          echo "Release $RELEASE_TAG has all $(echo "$published" | wc -l) assets."

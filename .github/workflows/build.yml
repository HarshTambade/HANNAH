name: Build Shanaya

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the completed platform packages as a GitHub Release
        type: boolean
        required: true
        default: false
      release_tag:
        description: New version tag to create when publishing manually (for example v1.0.0)
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
  VITE_OFFLINE_MODEL_URL: ${{ vars.VITE_OFFLINE_MODEL_URL }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
  ELECTRON_RELEASE_REQUESTED: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
  ELECTRON_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag) || '' }}

jobs:
  quality:
    name: Security and test gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm audit --audit-level=high
        working-directory: client
      - run: npm audit --prefix server --audit-level=high
      - run: npm test
        working-directory: client
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: python -m pip install -r backend/requirements-test.txt
      - run: python -m pytest -q backend/tests

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e --prefix client

  web:
    name: Web and PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build:analyzer
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npm run bundle:size -- --strict
        working-directory: client
      - uses: actions/upload-artifact@v4
        with:
          name: shanaya-web-pwa
          path: |
            client/dist
            client/bundle-report.html

  electron:
    name: Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap add @capawesome/capacitor-electron
        working-directory: client
      - name: Verify generated Electron project
        shell: bash
        run: |
          if [ ! -f client/electron/package.json ]; then
            echo "Capacitor Electron did not create client/electron/package.json." >&2
            exit 1
          fi
      - name: Apply Electron release configuration
        working-directory: client/electron
        env:
          ELECTRON_RELEASE_REQUESTED: ${{ env.ELECTRON_RELEASE_REQUESTED }}
          ELECTRON_RELEASE_TAG: ${{ env.ELECTRON_RELEASE_TAG }}
        run: node ../scripts/prepare-electron-release.mjs
      - run: npm install
        working-directory: client/electron
      - run: npm audit --audit-level=high
        working-directory: client/electron
      - run: npx cap sync @capawesome/capacitor-electron
        working-directory: client
      - name: Package Electron app
        working-directory: client/electron
        shell: bash
        env:
          ELECTRON_RELEASE_REQUESTED: ${{ env.ELECTRON_RELEASE_REQUESTED }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE || secrets.WINDOWS_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$ELECTRON_RELEASE_REQUESTED" = "true" ]; then
            if [ "$RUNNER_OS" = "Windows" ] && { [ -z "$WIN_CSC_LINK" ] || [ -z "$WIN_CSC_KEY_PASSWORD" ]; }; then
              echo "Windows signing secrets are not configured; building an unsigned Electron app." >&2
              ELECTRON_RELEASE_REQUESTED=false
            fi
            if [ "$RUNNER_OS" = "macOS" ] && { [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; }; then
              echo "macOS signing secrets are not configured; building an unsigned Electron app." >&2
              ELECTRON_RELEASE_REQUESTED=false
            fi
          fi
          if [ "$ELECTRON_RELEASE_REQUESTED" != "true" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          # GitHub Releases are published by the dedicated release job below.
          # Do not let electron-builder attempt an automatic Snap Store upload;
          # snapcraft is not installed on the runner and Snap is not required
          # for the release assets staged by this workflow.
          npm run pack -- --publish never
      - name: Enforce renderer and installer size targets
        working-directory: client/electron
        run: node ../scripts/check-bundle-size.mjs --strict --package-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: shanaya-electron-${{ matrix.os }}
          path: client/electron/dist/**
          if-no-files-found: error

  redteam:
    name: Red-team suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run red-team suite
        env:
          SHANAYA_API_TOKEN: ${{ secrets.SHANAYA_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$SHANAYA_API_TOKEN" ] || [ -z "$GROQ_API_KEY" ]; then
            echo "Red-team secrets are not configured; skipping."
            exit 0
          fi
          npm ci --ignore-scripts --prefix server
          (cd server && NODE_ENV=production PORT=3001 SHANAYA_API_TOKEN="$SHANAYA_API_TOKEN" GROQ_API_KEY="$GROQ_API_KEY" SHANAYA_RATE_LIMIT_AGENT_MAX=1000 npm start &) 
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          SHANAYA_API_URL=http://127.0.0.1:3001 SHANAYA_API_TOKEN="$SHANAYA_API_TOKEN" python scripts/run_redteam.py
          pkill -f "node.*index.js" || true

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.13113456 cmake;3.22.1"
      - name: Require Android release signing credentials
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are not configured; building an unsigned debug APK instead." >&2
          fi
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap sync android
        working-directory: client
      - run: npm run cap:patch:android
        working-directory: client
      - name: Build Android package
        working-directory: client/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            release_keystore="$RUNNER_TEMP/shanaya-release.keystore"
            trap 'rm -f "$release_keystore"' EXIT
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$release_keystore"
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file="$release_keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shanaya-android
          path: |
            client/android/app/build/outputs/apk/**/*.apk
            client/android/app/build/outputs/bundle/**/*.aab

  ios:
    name: iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Require iOS release signing credentials
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ "$IOS_SIGNING_ENABLED" != "true" ] || [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPSTORE_ISSUER_ID" ] || [ -z "$APPSTORE_API_KEY_ID" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ]; then
            echo "iOS signing secrets are not configured; skipping signed iOS release artifacts." >&2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: client
      - run: npm run cap:patch:ios
        working-directory: client
      - run: npm run models:draco
        working-directory: client
      - run: npm run build
        working-directory: client
        env:
          VITE_AVATAR_MODEL_URL: /models/avatar.draco.glb
      - run: npx cap sync ios
        working-directory: client
      - name: Import Apple signing certificate
        if: vars.IOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/shanaya-signing.p12"
          keychain_path="$RUNNER_TEMP/shanaya-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          rm -f "$certificate_path"
      - name: Install provisioning profile
        if: vars.IOS_SIGNING_ENABLED == 'true'
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          profile-type: IOS_APP_STORE
          bundle-id: com.shanaya.companion
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Archive iOS app
        env:
          IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$IOS_SIGNING_ENABLED" = "true" ]; then
            SIGNING_ALLOWED=YES
          else
            SIGNING_ALLOWED=NO
          fi
          if [ -d client/ios/App/App.xcworkspace ]; then
            XCODE_CONTAINER=(-workspace client/ios/App/App.xcworkspace)
          elif [ -d client/ios/App/App.xcodeproj ]; then
            XCODE_CONTAINER=(-project client/ios/App/App.xcodeproj)
          else
            echo "No generated iOS workspace or project found under client/ios/App" >&2
            find client/ios -maxdepth 3 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) -print >&2 || true
            exit 1
          fi
          xcodebuild \
            "${XCODE_CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shanaya.xcarchive" \
            CODE_SIGNING_ALLOWED="$SIGNING_ALLOWED" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive
      - name: Export signed iOS IPA
        if: vars.IOS_SIGNING_ENABLED == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Shanaya.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Remove temporary signing keychain
        if: always() && vars.IOS_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/shanaya-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/shanaya-signing.p12"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: shanaya-ios-archive
          path: |
            ${{ runner.temp }}/Shanaya.xcarchive
            ${{ runner.temp }}/ios-export/*.ipa

  release:
    name: Publish release installers
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [electron, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$RELEASE_TAG'; use vMAJOR.MINOR.PATCH (optionally with a prerelease suffix)." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: shanaya-*
          path: release-input
          merge-multiple: false
      - name: Stage platform installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          find_file() {
            local root="$1"
            local pattern="$2"
            local exclude="${3:-}"
            if [ -n "$exclude" ]; then
              find "$root" -type f -iname "$pattern" ! -path "$exclude" -print -quit
            else
              find "$root" -type f -iname "$pattern" -print -quit
            fi
          }

          copy_required() {
            local root="$1"
            local pattern="$2"
            local destination="$3"
            local exclude="${4:-}"
            local source
            source="$(find_file "$root" "$pattern" "$exclude")"
            if [ -z "$source" ]; then
              echo "Missing release package: $pattern under $root" >&2
              exit 1
            fi
            cp "$source" "release-assets/$destination"
          }

          copy_required release-input/shanaya-android '*.apk' 'Shanaya-Android.apk'
          copy_required release-input/shanaya-android '*.aab' 'Shanaya-Android.aab'
          copy_required release-input/shanaya-electron-macos-15 '*.dmg' 'Shanaya-macOS.dmg'
          copy_required release-input/shanaya-electron-windows-2022 '*.exe' 'Shanaya-Windows.exe' '*/win-unpacked/*'

          for root in release-input/shanaya-electron-*; do
            find "$root" -type f \( -iname '*.dmg' -o -iname '*.zip' -o -iname '*.exe' -o -iname '*.AppImage' -o -iname '*.deb' -o -iname '*.blockmap' -o -name 'latest*.yml' \) -exec cp -n {} release-assets/ \;
          done

          copy_required release-input/shanaya-electron-ubuntu-24.04 '*.AppImage' 'Shanaya-Linux.AppImage'
          copy_required release-input/shanaya-electron-ubuntu-24.04 '*.deb' 'Shanaya-Linux.deb'

          for manifest in latest.yml latest-mac.yml latest-linux.yml; do
            if [ ! -f "release-assets/$manifest" ]; then
              echo "Missing Electron auto-update manifest: $manifest" >&2
              exit 1
            fi
          done

          for manifest in release-assets/latest*.yml; do
            [ -f "$manifest" ] || continue
            if ! grep -q '^stagingPercentage:' "$manifest"; then
              printf '\nstagingPercentage: 10\n' >> "$manifest"
            fi
          done

          ios_ipa="$(find_file release-input/shanaya-ios-archive '*.ipa')"
          if [ -z "$ios_ipa" ]; then
            echo "Missing signed iOS IPA; configure iOS signing before publishing a release." >&2
            exit 1
          fi
          cp "$ios_ipa" release-assets/Shanaya-iOS.ipa

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ] || [ -z "$GPG_PASSPHRASE" ]; then
            echo "GPG_PRIVATE_KEY and GPG_PASSPHRASE are required to sign Linux release packages." >&2
            exit 1
          fi
          umask 077
          gpg_key_path="$RUNNER_TEMP/shanaya-release-signing.asc"
          gpg_passphrase_path="$RUNNER_TEMP/shanaya-release-signing.passphrase"
          trap 'rm -f "$gpg_key_path" "$gpg_passphrase_path"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" > "$gpg_key_path"
          printf '%s' "$GPG_PASSPHRASE" > "$gpg_passphrase_path"
          gpg --batch --import "$gpg_key_path"
          for package in release-assets/Shanaya-Linux.AppImage release-assets/Shanaya-Linux.deb; do
            if [ -f "$package" ]; then
              gpg --batch --yes --pinentry-mode loopback --passphrase-file "$gpg_passphrase_path" --armor --detach-sign --output "$package.asc" "$package"
            fi
          done
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Shanaya $RELEASE_TAG"
          fi

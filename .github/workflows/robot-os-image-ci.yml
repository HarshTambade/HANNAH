name: Robot OS Image CI

on:
  push:
    paths:
      - 'robot-os/images/**'
      - 'robot-os/systemd/**'
      - '.github/workflows/robot-os-image-ci.yml'
  pull_request:
    paths:
      - 'robot-os/images/**'
      - 'robot-os/systemd/**'
      - '.github/workflows/robot-os-image-ci.yml'

jobs:
  scripts-and-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests
        run: python robot-os/tools/validate_manifests.py
      - name: Shell syntax check
        run: bash -n robot-os/images/scripts/*.sh
      - name: Build development rootfs (Linux, privileged steps)
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-utils
          sudo env OUT=/tmp/hannah-rootfs.tar.gz bash robot-os/images/scripts/build-dev-rootfs.sh /tmp/hannah-rootfs
          ls -lh /tmp/hannah-rootfs.tar.gz

appId: com.hannah.companion
productName: HANNAH
artifactName: "${productName}-${os}-${arch}.${ext}"
asar: true
# The macOS control helper (scripts/build-macos-control.mjs) must run as its own program, so it stays outside app.asar.
asarUnpack:
  - assets/hannah-control
compression: maximum
directories:
  output: dist
  buildResources: assets
files:
  - build/**/*
  - app/**/*
  - generated/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.d.ts"
  - from: vendor/node_modules
    to: node_modules
# hannah:// links open the installed app on a screen (hannah://chat, hannah://settings …).
protocols:
  - name: HANNAH
    schemes: [hannah]
publish:
  - provider: github
    owner: HarshTambade
    repo: HANNAH
# App icons: generated from public/icon.svg by scripts/generate-brand-assets.mjs and copied to
# build-resources/ by scripts/prepare-electron-release.mjs. Without these, electron-builder ships Electron's icon.
win:
  icon: build-resources/icon.ico
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: build-resources/icon.ico
  uninstallerIcon: build-resources/icon.ico
  installerHeaderIcon: build-resources/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build-resources/icon.icns
  forceCodeSigning: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.lifestyle
  # macOS asks before an app uses the microphone or the local network; without
  # these descriptions voice input and local AI servers can't work.
  extendInfo:
    NSMicrophoneUsageDescription: HANNAH uses the microphone so you can talk with her. If you turn on "Hey HANNAH", it also listens for her name while the app is open; that listening happens on this Mac and the audio never leaves it.
    NSAppleEventsUsageDescription: HANNAH sends iMessage replies through the Messages app, only to people you approved, after you turn iMessage on in Chat apps.
    NSLocalNetworkUsageDescription: HANNAH connects to AI models running on your network, such as Ollama, when you choose local AI.
  hardenedRuntime: true
  entitlements: ../config/entitlements.mac.plist
  entitlementsInherit: ../config/entitlements.mac.inherit.plist
  notarize: false
linux:
  icon: build-resources/png
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: "HANNAH contributors <support@hannah.app>"

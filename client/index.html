<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="application-name" content="HANNAH" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- The build plugin (scripts/seoPlugin.ts) adds the title, description, canonical, social preview, indexing and schema.org data. -->
    <!-- HANNAH_SEO_TAGS -->
    <!-- The desktop and mobile apps (not the website) show a splash until HANNAH is ready; main.tsx removes it. -->
    <script>
      (function () {
        var protocol = location.protocol, origin = location.origin;
        if (protocol === "capacitor:" || protocol === "capacitor-electron:" || origin === "https://localhost") document.documentElement.classList.add("native-app");
        // Text size (Settings → Appearance), applied before the first paint so nothing jumps.
        try {
          var size = window.localStorage.getItem("hannah.textSize");
          if (size === "large" || size === "larger") document.documentElement.setAttribute("data-text-size", size);
        } catch (error) {}
      })();
    </script>
    <style>
      #boot-splash { display: none; }
      .native-app #boot-splash { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(60% 45% at 50% 42%, #1c2140 0%, #0c0e14 72%); color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity 0.35s ease; }
      .native-app #boot-splash.boot-splash-done { opacity: 0; pointer-events: none; }
      #boot-splash svg { width: 88px; height: 88px; animation: hannah-breathe 1.8s ease-in-out infinite; }
      #boot-splash .boot-splash-name { margin-top: 22px; padding-left: 0.32em; font-size: 20px; font-weight: 600; letter-spacing: 0.32em; }
      #boot-splash .boot-splash-tagline { margin-top: 6px; font-size: 13px; color: #94a3b8; }
      @keyframes hannah-breathe { 50% { transform: scale(0.94); opacity: 0.82; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="bs-a" gradientUnits="userSpaceOnUse" x1="256" y1="106" x2="406" y2="256"><stop offset="0" stop-color="#4f8ff0"/><stop offset="1" stop-color="#8be3f2"/></linearGradient><linearGradient id="bs-b" gradientUnits="userSpaceOnUse" x1="406" y1="256" x2="256" y2="406"><stop offset="0" stop-color="#8be3f2"/><stop offset="1" stop-color="#f7e27a"/></linearGradient><linearGradient id="bs-c" gradientUnits="userSpaceOnUse" x1="256" y1="406" x2="106" y2="256"><stop offset="0" stop-color="#f7e27a"/><stop offset="1" stop-color="#f4a9c0"/></linearGradient><linearGradient id="bs-d" gradientUnits="userSpaceOnUse" x1="106" y1="256" x2="256" y2="106"><stop offset="0" stop-color="#f4a9c0"/><stop offset="1" stop-color="#4f8ff0"/></linearGradient></defs><g fill="none" stroke-width="78"><path d="M256 106a150 150 0 0 1 150 150" stroke="url(#bs-a)"/><path d="M406 256a150 150 0 0 1-150 150" stroke="url(#bs-b)"/><path d="M256 406a150 150 0 0 1-150-150" stroke="url(#bs-c)"/><path d="M106 256a150 150 0 0 1 150-150" stroke="url(#bs-d)"/></g></svg><div class="boot-splash-name">HANNAH</div><div class="boot-splash-tagline">Your Personal AI</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

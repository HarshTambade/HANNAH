# HANNAH Robot OS writable state. The root filesystem is read-only; these are
# on the /var partition or in /run. The service units' ReadWritePaths= need
# every one of these to exist before they start.
#Type Path                                   Mode User  Group Age Argument
d     /var/lib/hannah-robot-os               0750 hannah hannah -
d     /var/lib/hannah-robot-os/status        0750 hannah hannah -
d     /var/lib/hannah-robot-os/safety        0750 hannah hannah -
d     /var/log/hannah-robot-os               0750 hannah hannah -
d     /run/hannah-robot-os                   0750 hannah hannah -
d     /var/home                              0755 root  root  -
d     /var/lib/hannah-system                 0755 root  root  -
d     /var/lib/hannah-system/ssh             0755 root  root  -
d     /var/lib/hannah-system/ssh/authorized_keys 0755 root root -
d     /var/lib/hannah-system/firewall        0755 root  root  -
f     /var/lib/hannah-system/firewall/00-local.nft 0644 root root - # local nftables rules (included by /etc/nftables.conf)

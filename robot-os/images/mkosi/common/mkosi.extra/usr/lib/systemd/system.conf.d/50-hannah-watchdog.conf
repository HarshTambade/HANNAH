# HANNAH Robot OS: systemd pets the hardware watchdog (/dev/watchdog0) every
# 15 s; if the system hangs for 30 s the watchdog resets the computer. A reboot
# that itself hangs is forced after 10 minutes. Boards without a watchdog
# device simply log that none was found.
#
# This restarts a hung computer. It does not stop motors: the motor
# controllers' own command timeouts and the hardware emergency stop do that.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min

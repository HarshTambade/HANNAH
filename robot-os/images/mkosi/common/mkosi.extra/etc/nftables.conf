#!/usr/sbin/nft -f
# HANNAH Robot OS firewall: outbound only.
#
# The robot opens every connection itself (remote gateway, updates, time),
# so nothing is accepted inbound except replies to those connections and the
# ICMP and neighbour discovery a network needs. SSH stays closed unless the
# provisioning file lists networks in ssh_allow_from; hannah-firstboot then
# writes /var/lib/hannah-system/firewall/20-ssh.nft.
#
# SocketCAN is not IP traffic and is not affected by these rules.

flush ruleset

table inet hannah {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        icmp type { echo-reply, destination-unreachable, time-exceeded, parameter-problem } accept
        icmpv6 type { echo-reply, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        udp sport 67 udp dport 68 accept comment "DHCPv4 replies"
        udp sport 547 udp dport 546 accept comment "DHCPv6 replies"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# Rules added on the robot (first boot writes 20-ssh.nft). tmpfiles.d always
# creates 00-local.nft, so the pattern matches at least one file.
include "/var/lib/hannah-system/firewall/*.nft"

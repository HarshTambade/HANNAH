# HANNAH Robot OS: SSH public keys only, for hannah-admin only.
# Host key and authorized keys live on /var; the root filesystem is read-only.
# The firewall keeps port 22 closed unless the provisioning file opened it
# for listed networks.
HostKey /var/lib/hannah-system/ssh/ssh_host_ed25519_key
AuthorizedKeysFile /var/lib/hannah-system/ssh/authorized_keys/%u
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
PermitRootLogin no
AllowGroups hannah-admin
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

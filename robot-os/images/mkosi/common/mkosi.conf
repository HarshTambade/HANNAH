# HANNAH Robot OS disk image: settings shared by every board.
#
# Built with mkosi (pinned in robot-os/images/mkosi/VERSIONS). Do not run
# mkosi on this directory directly: robot-os/images/build.sh assembles a
# project from common/ + boards/<board>/ + a generated mkosi.conf.d/00-build.conf
# (architecture, kernel, version, console) and the Robot OS files, then runs
# mkosi on that.
#
# Debian 13 "trixie" is the base because Debian ships a PREEMPT_RT kernel
# (linux-image-rt-amd64 / linux-image-rt-arm64) in its main archive;
# Ubuntu's real-time kernel needs an Ubuntu Pro subscription.

[Distribution]
Distribution=debian
Release=trixie
Repositories=main,non-free-firmware

[Output]
ImageId=hannah-robot-os
Format=disk
ManifestFormat=json

[Content]
WithDocs=no
Locale=C.UTF-8
Timezone=UTC
Keymap=us
Autologin=no
# No RootPassword= on purpose: root stays locked and no account has a password.
# The kernel package is chosen per build (standard or PREEMPT_RT) in 00-build.conf.
KernelCommandLine=ro systemd.firstboot=no
Packages=
        systemd
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        libpam-systemd
        udev
        dbus
        kmod
        procps
        iproute2
        e2fsprogs
        dosfstools
        nftables
        openssh-server
        sudo
        python3
        ca-certificates
        can-utils
        plymouth
        plymouth-themes
        firmware-linux-free

# /var: the only writable partition. Logs, the robot's identity, SSH keys,
# enrollment, service state and the update state. Kept across updates.
# Type linux-generic, mounted by label from /etc/fstab, so systemd's automatic
# partition discovery never mounts it somewhere else.
[Partition]
Type=linux-generic
Label=hannah-var
Format=ext4
CopyFiles=/var:/
SizeMinBytes=2G

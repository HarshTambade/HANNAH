# Root slot A: this version's operating system, mounted read-only.
# The label carries the version (systemd-sysupdate's naming); build.sh fills it in.
# /var and the boot files live on their own partitions.
[Partition]
Type=root
Label=hannah-robot-os_@IMAGE_VERSION@
Format=ext4
CopyFiles=/
ExcludeFiles=/var/
ExcludeFiles=/efi/
SizeMinBytes=2G
SizeMaxBytes=2G

# UEFI board: x86_64 PCs and industrial computers, and generic arm64 UEFI
# machines (QEMU virt, Ampere, and Jetson-style boards whose firmware boots
# UEFI). systemd-boot loads a unified kernel image (kernel + initrd + command
# line in one EFI file); boot counting falls back to the previous entry when a
# new version never reaches boot-complete.target.
#
# Jetson: this image uses Debian's generic arm64 kernel. NVIDIA's GPU,
# camera and carrier-board drivers come only with the L4T kernel, which this
# image does not include.

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
Packages=
        systemd-boot
        systemd-boot-efi

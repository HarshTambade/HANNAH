# Raspberry Pi 4 and 5 (arm64). The Pi's own boot firmware reads config.txt,
# cmdline.txt, the kernel and the initrd from a FAT partition; Debian's
# raspi-firmware package writes those to /boot/firmware, which becomes that
# partition. There is no UEFI and no systemd-boot here, so the boot-counting
# fallback of the UEFI image does not exist on the Pi: cmdline.txt names slot
# A, and switching slots after an update is not implemented for this board.
#
# Pi 4 is the primary target. Pi 5 depends on Debian trixie's Pi 5 support in
# its kernel and raspi-firmware; neither board has booted this image.

[Content]
Bootable=no
Packages=
        raspi-firmware
        initramfs-tools
        firmware-brcm80211

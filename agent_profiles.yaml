research:
  name: research
  modelTier: high-capability cloud
  allowedTools: [knowledge_search, knowledge_documents, list_app_files, read_app_file]
  maxIterations: 10
  timeoutMs: 90000

maintenance:
  name: maintenance
  modelTier: local
  allowedTools: []
  maxIterations: 4
  timeoutMs: 20000

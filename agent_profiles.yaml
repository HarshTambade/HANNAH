default:
  name: default
  modelTier: low-cost cloud
  allowedTools: all
  maxIterations: 8
  timeoutMs: 30000

chat:
  name: chat
  modelTier: low-cost cloud
  allowedTools: []
  maxIterations: 4
  timeoutMs: 20000

code:
  name: code
  modelTier: high-capability cloud
  allowedTools: [list_app_files, read_app_file, write_app_file]
  maxIterations: 12
  timeoutMs: 60000

system:
  name: system
  modelTier: low-cost cloud
  allowedTools: [get_device_status, get_battery_status, open_app, toggle_setting]
